<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BOTTLE_FLIP 2</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍾</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    min-height:100dvh; overflow:hidden; overscroll-behavior:none;
    background:#0a0d16; color:#eaf2ff;
    font-family:'JetBrains Mono', ui-monospace, 'Courier New', monospace;
    touch-action:none; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
  }
  canvas{position:fixed; inset:0; display:block}
  header,#hud{position:fixed; left:50%; transform:translateX(-50%); z-index:2; pointer-events:none}
  header{top:10px}
  h1{font-size:clamp(18px,4vw,26px); font-weight:800; letter-spacing:.14em; text-align:center;
     text-shadow:0 0 24px rgba(120,200,255,.35)}
  .cursor{animation:blink 1.1s steps(1) infinite; color:#7fd4ff}
  @keyframes blink{50%{opacity:0}}
  #hud{top:52px; display:flex; gap:8px}
  .glass{
    background:linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
    backdrop-filter:blur(16px) saturate(140%); -webkit-backdrop-filter:blur(16px) saturate(140%);
    border:1px solid rgba(255,255,255,.16); border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12);
  }
  .stat{display:flex; flex-direction:column; align-items:center; gap:1px; padding:6px 14px; min-width:82px}
  .lbl{font-size:9px; letter-spacing:.22em; opacity:.55}
  .val{font-size:18px; font-weight:800}
  .val.pop{animation:vpop .25s cubic-bezier(.2,1.6,.4,1)}
  @keyframes vpop{0%{transform:scale(1.4)}100%{transform:scale(1)}}
  #streakV{color:#7fd4ff} #bestV{color:#ffd76a}
  .hint{position:fixed; bottom:5vh; left:50%; transform:translateX(-50%); z-index:2; pointer-events:none;
    font-size:12px; letter-spacing:.18em; animation:pulse 1.3s ease-in-out infinite; transition:opacity .6s}
  .hint.gone{opacity:0}
  @keyframes pulse{0%,100%{opacity:.7}50%{opacity:.25}}
  #toasts{position:fixed; top:110px; right:12px; z-index:4; display:flex; flex-direction:column; gap:8px; pointer-events:none}
  .toast{padding:9px 14px; border-radius:12px; font-size:11px; line-height:1.5; letter-spacing:.06em;
    background:rgba(14,18,30,.8); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid; animation:tin .35s cubic-bezier(.2,1.4,.4,1); transition:opacity .4s, transform .4s}
  .toast.out{opacity:0; transform:translateX(36px)}
  @keyframes tin{from{opacity:0; transform:translateX(46px)} to{opacity:1; transform:none}}
  #over{position:fixed; inset:0; z-index:5; display:flex; align-items:center; justify-content:center;
    background:rgba(8,10,18,.55); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); transition:opacity .3s}
  #over.hidden{opacity:0; pointer-events:none}
  .panel{padding:30px 44px; text-align:center; display:flex; flex-direction:column; gap:10px; align-items:center}
  .overTitle{font-size:14px; letter-spacing:.3em; opacity:.6}
  .big{font-size:clamp(38px,9vw,56px); font-weight:800; text-shadow:0 0 30px rgba(127,212,255,.4)}
  .newbest{color:#ffd76a; font-size:13px; letter-spacing:.2em; text-shadow:0 0 16px rgba(255,200,80,.5)}
  .dim{font-size:12px; opacity:.6}
  .hint2{font-size:12px; letter-spacing:.16em; opacity:.7; animation:pulse 1.3s infinite}
</style>
</head>
<body>
<canvas id="c"></canvas>
<header><h1>BOTTLE_FLIP<span class="cursor">▮</span></h1></header>
<div id="hud">
  <div class="glass stat"><span class="lbl">SCORE</span><span id="scoreV" class="val">0</span></div>
  <div class="glass stat"><span class="lbl">BEST</span><span id="bestV" class="val">0</span></div>
  <div class="glass stat"><span class="lbl">STREAK</span><span id="streakV" class="val">—</span></div>
</div>
<div id="hint" class="hint">HOLD to charge · more power = more spins = more points</div>
<div id="toasts"></div>
<div id="over" class="hidden">
  <div class="glass panel">
    <div class="overTitle">// BOTTLE_SHATTERED</div>
    <div id="ovScore" class="big">0</div>
    <div id="ovNew" class="newbest" style="display:none">★ NEW BEST ★</div>
    <div id="ovInfo" class="dim"></div>
    <div class="hint2">tap / space to retry</div>
  </div>
</div>

<script>
(() => {
'use strict';
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const scoreV=document.getElementById('scoreV'), bestV=document.getElementById('bestV'),
  streakV=document.getElementById('streakV'), overEl=document.getElementById('over'),
  ovScore=document.getElementById('ovScore'), ovNew=document.getElementById('ovNew'),
  ovInfo=document.getElementById('ovInfo'), hintEl=document.getElementById('hint'),
  toastsEl=document.getElementById('toasts');

let W,H,DPR,S;
function resize(){ DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
  canvas.width=W*DPR; canvas.height=H*DPR;
  S=Math.max(0.6, Math.min(W/560, H/820, 1.15)); }
addEventListener('resize',resize); resize();

// ------- constants -------
const G=1500, BH=92, UP_TOL=0.32, WOB_TOL=0.55;
const U=p=>320+7.2*p, VX=p=>150+2.3*p;
const flightT=(u,dy)=>(u+Math.sqrt(Math.max(1,u*u-2*G*dy)))/G;
const nFor=p=>Math.min(3, 1+Math.floor(p/34));   // trick spins by power
const fmt=n=>{ n=Math.floor(n); return n>=1000?(n/1000).toFixed(1)+'k':String(n); };
const SKINS=[
  {cap:'#7fd4ff',water:'rgba(90,210,255,.55)'},
  {cap:'#5ad07a',water:'rgba(110,255,170,.5)'},
  {cap:'#ffd76a',water:'rgba(255,215,106,.5)'},
  {cap:'#e055c8',water:'rgba(255,110,220,.5)'},
  {cap:'#ff9d3c',water:'rgba(255,175,80,.55)'},
  {cap:'#ff5f6d',water:'rgba(255,120,120,.55)'}];

// ------- state -------
let bottle,cur,next,sol,coins=[],wind=0,state='ready';
let score=0, flips=0, streak=0, best=+(localStorage.getItem('bottle_flip_best2')||0);
let power=0, charging=false, chDir=1, wobbleT=0, dieT=0, dieDir=1, diePlat=null, overAt=0, time=0;
let slowT=0, shake=0, zoom=0, shX=0, shY=0, camX=0, camY=60, nearMiss=false, lastTick=0;
let particles=[], popups=[], trail=[], windLines=[], specks=[];
bestV.textContent=fmt(best);

const rand=(a,b)=>a+Math.random()*(b-a);
for(let i=0;i<70;i++) specks.push({x:rand(-1500,3000),y:rand(-400,2200),par:rand(.15,.5),s:rand(1,2.6)});

function toast(html,color){
  while(toastsEl.children.length>=4) toastsEl.firstChild.remove();
  const d=document.createElement('div'); d.className='toast';
  d.style.borderColor=color; d.innerHTML=html; toastsEl.appendChild(d);
  setTimeout(()=>{ d.classList.add('out'); setTimeout(()=>d.remove(),420); },2600);
}
function genNext(){
  const lvl=flips;
  const w=Math.max(76,150-lvl*4);
  const pStar=rand(28,88);
  const dyMax=Math.min(120,U(pStar)*U(pStar)/(2*G)-80);
  const dy=rand(-70,Math.max(-70,dyMax));
  const T=flightT(U(pStar),dy);
  const gap=VX(pStar)*T;
  next={x:cur.x+gap,baseX:cur.x+gap,y:cur.y+dy,w,
    move:lvl>=5&&Math.random()<0.5,amp:0,phase:rand(0,7),bounce:0};
  if(next.move) next.amp=Math.min(46,16+lvl*2);
  wind = lvl>=8 ? (Math.random()<.5?-1:1)*rand(45,Math.min(150,40+lvl*5)) : 0;
  if(lvl===8) toast('<b style="color:#7fd4ff">WIND_ENABLED</b><br>watch the drift arrows','#7fd4ff');
  coins=[];
  for(const f of [0.34,0.54,0.74]){
    const t=T*f;
    coins.push({x:cur.x+VX(pStar)*t+0.5*wind*t*t,
      y:cur.y+U(pStar)*t-0.5*G*t*t+rand(-8,22), got:false, ph:rand(0,6)});
  }
  sol={pStar,T,dy};
}
function reset(){
  score=0; flips=0; streak=0; power=0; charging=false; wobbleT=0; slowT=0; shake=0; zoom=0;
  cur={x:0,y:0,w:150,move:false,amp:0,phase:0,baseX:0,bounce:0};
  bottle={x:0,y:0,vx:0,vy:0,ang:0,om:0,off:0};
  particles=[]; popups=[]; trail=[]; nearMiss=false;
  genNext(); state='ready';
  scoreV.textContent='0'; streakV.textContent='—';
  overEl.classList.add('hidden');
}

// ------- audio -------
let AC=null;
function ensureAudio(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume(); }
function tone(f,dur,type,vol,slide,delay=0){
  if(!AC)return;
  try{ const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+0.05);
  }catch(e){}
}
const sndLaunch=()=>tone(700,.28,'triangle',.3,140);
const sndTick=p=>tone(280+p*7,.04,'square',.07);
const sndCoin=()=>{tone(1200,.07,'square',.14,1700); tone(1800,.1,'square',.1,0,.05);};
const sndLand=(n,perf)=>{ tone(150,.1,'sine',.4,70);
  tone(520+n*60+(perf?200:0),.22,'sine',.25,0,.05); };
const sndPerfect=()=>{[660,880,1320].forEach((f,i)=>tone(f,.22,'sine',.22,0,i*.07));};
const sndWobble=()=>{tone(190,.1,'triangle',.14,170); tone(170,.1,'triangle',.14,150,.12);};
const sndShatter=()=>{ tone(2200,.14,'square',.13,400); tone(900,.2,'sawtooth',.12,150,.03);
  tone(220,.5,'sawtooth',.22,60,.05); };

// ------- FX -------
function popup(text,x,y,color,size){ popups.push({text,x,y,life:1,color,size:size||22}); }
function dust(x,y,n,color,spd=260){
  for(let i=0;i<n;i++){ const a=rand(-Math.PI,0), v=rand(60,spd);
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.35,.7),color,s:rand(2,5),shard:false}); }
}
function shatter(x,y){
  for(let i=0;i<20;i++){ const a=rand(0,Math.PI*2), v=rand(120,480);
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v+140,life:rand(.5,1),
      color:i%3?'rgba(220,240,255,.85)':'rgba(127,212,255,.8)',s:rand(3,7),shard:true,rot:rand(0,6)}); }
  dust(x,y,10,SKINS[Math.floor(flips/10)%SKINS.length].water,320);
}
function confetti(x,y){
  const cols=['#7fd4ff','#ffd76a','#5ad07a','#e055c8','#ff9d3c'];
  for(let i=0;i<40;i++){ const a=rand(0,Math.PI*2), v=rand(140,460);
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.5,1),color:cols[i%5],s:rand(3,6),shard:false}); }
}

// ------- actions -------
function release(){
  if(state!=='ready'||!charging) return;
  charging=false;
  const p=power, n=nFor(p);
  const T=flightT(U(p),sol.dy);
  bottle.vx=VX(p); bottle.vy=U(p);
  bottle.om=2*Math.PI*n/T*rand(0.985,1.015);
  bottle.spinN=n;
  state='fly'; power=0; trail=[]; nearMiss=false;
  hintEl.classList.add('gone');
  sndLaunch();
}
function land(plat){
  const a=((bottle.ang%(Math.PI*2))+Math.PI*3)%(Math.PI*2)-Math.PI;
  const aa=Math.abs(a);
  if(aa<WOB_TOL){
    bottle.y=plat.y; bottle.ang=0; bottle.om=0; bottle.vx=0; bottle.vy=0;
    bottle.off=bottle.x-plat.x;
    state='ready'; plat.bounce=1;
    dust(bottle.x,plat.y,12,'rgba(255,255,255,.7)');
    shake=Math.max(shake,0.3);
    if(plat===next){
      flips++; streak++;
      const n=bottle.spinN||1, perfect=aa<0.09, close=aa>UP_TOL;
      const pts=100*n*(perfect?2:1)+streak*10;
      score+=pts;
      scoreV.textContent=fmt(score);
      scoreV.classList.remove('pop'); void scoreV.offsetWidth; scoreV.classList.add('pop');
      streakV.textContent='×'+streak;
      if(perfect){
        popup(`PERFECT +${pts}`,bottle.x,plat.y+150,'#ffd76a',26);
        confetti(bottle.x,plat.y+40); sndPerfect();
        slowT=0.35; zoom=1; shake=0.7;
      } else if(close){
        popup(`CLOSE! +${pts}`,bottle.x,plat.y+150,'#7fd4ff',22);
        wobbleT=0.9; sndWobble(); sndLand(n,false);
      } else {
        popup(`+${pts}`,bottle.x,plat.y+150,'#5ad07a',20); sndLand(n,false);
      }
      if(n>=2) popup(`${n===2?'DOUBLE':'TRIPLE'} FLIP ×${n}`,bottle.x,plat.y+185,'#e055c8',16);
      if(flips%10===0){
        toast(`<b style="color:#ffd76a">ALTITUDE ${flips}</b><br>new bottle skin unlocked`,'#ffd76a');
        confetti(bottle.x,plat.y+60);
      }
      cur=next; genNext();
    } else {
      popup('back?',bottle.x,plat.y+120,'rgba(255,255,255,.5)',13);
      sndLand(1,false);
    }
  } else die(plat, Math.sign(a)||1);
}
function die(plat,dir){
  state='dying'; dieT=0; dieDir=dir; diePlat=plat;
  streak=0; streakV.textContent='—';
  shatter(bottle.x,bottle.y+BH/2);
  sndShatter();
  if(nearMiss && !plat) popup('SO CLOSE!',next.x,next.y+120,'#ff5f6d',20);
}
function showOver(){
  state='over'; overAt=performance.now();
  const isNew=score>best;
  if(isNew){ best=score; localStorage.setItem('bottle_flip_best2',best); }
  bestV.textContent=fmt(best);
  ovScore.textContent=fmt(score);
  ovNew.style.display=isNew?'':'none';
  ovInfo.textContent=`altitude ${flips} · best ${fmt(best)}`;
  overEl.classList.remove('hidden');
}

// ------- update -------
function update(dt){
  time+=dt;
  let ts=1; if(slowT>0){ slowT-=dt; ts=0.22; }
  const g=dt*ts;
  shake=Math.max(0,shake-dt*3); zoom=Math.max(0,zoom-dt*2.5);
  shX=(Math.random()*2-1)*shake*10*S; shY=(Math.random()*2-1)*shake*8*S;

  if(next&&next.move) next.x=next.baseX+Math.sin(time*1.4+next.phase)*next.amp;
  if(next) next.bounce=Math.max(0,next.bounce-dt*2.2);
  if(cur) cur.bounce=Math.max(0,cur.bounce-dt*2.2);

  if(state==='ready'){
    bottle.x=cur.x+bottle.off; bottle.y=cur.y;
    if(charging){
      const spd=Math.min(130,88+flips*1.5);
      const prev=power;
      power+=chDir*spd*g;
      if(power>=100){power=100;chDir=-1}
      if(power<=0){power=0;chDir=1}
      if(Math.floor(power/12)!==Math.floor(prev/12)) sndTick(power);
    }
    if(wobbleT>0) wobbleT-=dt;
  }
  else if(state==='fly'){
    const prevY=bottle.y;
    bottle.vy-=G*g; bottle.vx+=wind*g;
    bottle.x+=bottle.vx*g; bottle.y+=bottle.vy*g;
    bottle.ang+=bottle.om*g;
    trail.push({x:bottle.x,y:bottle.y+BH/2}); if(trail.length>12) trail.shift();
    if(streak>=5 && Math.random()<0.6){
      particles.push({x:bottle.x+rand(-8,8),y:bottle.y+BH*0.25,vx:rand(-30,30)-bottle.vx*0.1,
        vy:rand(20,90),life:rand(.25,.5),color:Math.random()<.5?'#ff9d3c':'#ff5f6d',s:rand(3,6),shard:false});
    }
    for(const c of coins){
      if(!c.got && Math.hypot(bottle.x-c.x,(bottle.y+BH/2)-c.y)<52){
        c.got=true; score+=25; scoreV.textContent=fmt(score);
        popup('+25',c.x,c.y+30,'#ffd76a',16);
        dust(c.x,c.y,8,'#ffd76a',180); sndCoin();
      }
    }
    if(bottle.vy<0){
      for(const plat of [next,cur]){
        if(prevY>=plat.y && bottle.y<=plat.y){
          if(bottle.x>plat.x-plat.w/2-6 && bottle.x<plat.x+plat.w/2+6){ land(plat); break; }
          else if(plat===next && Math.abs(Math.abs(bottle.x-plat.x)-plat.w/2)<40) nearMiss=true;
        }
      }
    }
    if(state==='fly' && bottle.y<Math.min(cur.y,next.y)-900) die(null,1);
  }
  else if(state==='dying'){
    dieT+=dt;
    if(diePlat){ bottle.ang+=(dieDir*1.57-bottle.ang)*Math.min(1,dt*14); bottle.y=diePlat.y; }
    else { bottle.vy-=G*g; bottle.y+=bottle.vy*g; bottle.ang+=dieDir*3*g; }
    if(dieT>0.85) showOver();
  }

  if(wind!==0 && Math.random()<0.3){
    windLines.push({x:wind>0?camX-W/S:camX+W/S, y:camY+rand(-260,360), life:1});
  }
  for(let i=windLines.length-1;i>=0;i--){ const l=windLines[i];
    l.x+=wind*6*g; l.life-=g*0.8; if(l.life<=0)windLines.splice(i,1); }
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i];
    p.vy-=(p.shard?1300:900)*g; p.x+=p.vx*g; p.y+=p.vy*g; p.life-=g;
    if(p.shard)p.rot+=p.vx*0.01*g;
    if(p.life<=0)particles.splice(i,1); }
  for(let i=popups.length-1;i>=0;i--){ const p=popups[i];
    p.y+=55*g; p.life-=dt*0.9; if(p.life<=0)popups.splice(i,1); }

  const k=1-Math.exp(-dt*5);
  camX+=(bottle.x+(state==='fly'?50:0)-camX)*k;
  camY+=((bottle.y+60)-camY)*k;
}

// ------- render -------
function P(x,y){
  const z=S*(1+zoom*0.06);
  return {x: W*0.45+(x-camX)*z+shX, y: H*0.60-(y-camY)*z+shY};
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const hue=(200+flips*12)%360;
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,`hsl(${hue},45%,9%)`);
  bg.addColorStop(1,`hsl(${(hue+50)%360},50%,22%)`);
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  for(const s of specks){
    const q=P(s.x*s.par+camX*(1-s.par), s.y*s.par+camY*(1-s.par));
    ctx.globalAlpha=0.25+s.par*0.3;
    ctx.fillStyle='#fff';
    ctx.fillRect(q.x,q.y,s.s*S,s.s*S);
  }
  ctx.globalAlpha=1;
  ctx.strokeStyle='rgba(180,220,255,.25)'; ctx.lineWidth=1.5;
  for(const l of windLines){
    const q=P(l.x,l.y);
    ctx.globalAlpha=l.life*0.5;
    ctx.beginPath(); ctx.moveTo(q.x,q.y); ctx.lineTo(q.x-Math.sign(wind)*34*S,q.y); ctx.stroke();
  }
  ctx.globalAlpha=1;

  drawPlat(cur); drawPlat(next);

  for(const c of coins){
    if(c.got) continue;
    const q=P(c.x, c.y+Math.sin(time*3+c.ph)*5);
    ctx.fillStyle='#ffd76a';
    ctx.shadowColor='rgba(255,215,106,.8)'; ctx.shadowBlur=14*S;
    ctx.beginPath(); ctx.arc(q.x,q.y,10*S,0,7); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(q.x-3*S,q.y-3*S,2.6*S,0,7); ctx.fill();
  }

  for(let i=0;i<trail.length;i++){
    const t=trail[i], q=P(t.x,t.y);
    ctx.globalAlpha=(i/trail.length)*0.3;
    ctx.fillStyle=streak>=5?'#ff9d3c':'#7fd4ff';
    ctx.beginPath(); ctx.arc(q.x,q.y,(2+i*0.5)*S,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;

  if(charging && state==='ready'){
    let x=bottle.x,y=bottle.y,vy=U(power),vx=VX(power);
    ctx.fillStyle='rgba(255,255,255,.45)';
    for(let i=0;i<42;i++){
      vy-=G*0.03; vx+=wind*0.03; x+=vx*0.03; y+=vy*0.03;
      if(i%3===0){ const p=P(x,y);
        ctx.globalAlpha=Math.max(0,.5-i*0.01);
        ctx.beginPath(); ctx.arc(p.x,p.y,3*S,0,7); ctx.fill(); }
      if(vy<0&&y<next.y) break;
    }
    ctx.globalAlpha=1;
    const bp=P(bottle.x-54,bottle.y);
    ctx.fillStyle='rgba(255,255,255,.12)';
    roundRect(bp.x-6,bp.y-130*S,12,130*S,6); ctx.fill();
    const hgt=power/100*126*S;
    ctx.fillStyle=`hsl(${120-power*1.1},85%,60%)`;
    roundRect(bp.x-4,bp.y-4-hgt,8,hgt,4); ctx.fill();
    const n=nFor(power);
    ctx.font=`800 ${16*S}px 'JetBrains Mono', monospace`;
    ctx.textAlign='center';
    ctx.fillStyle=n===3?'#e055c8':n===2?'#7fd4ff':'rgba(255,255,255,.6)';
    ctx.fillText(`SPIN ×${n}`, bp.x, bp.y-140*S);
  }

  drawBottle();

  for(const p of particles){
    const q=P(p.x,p.y);
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.6));
    ctx.fillStyle=p.color;
    if(p.shard){ ctx.save(); ctx.translate(q.x,q.y); ctx.rotate(p.rot);
      ctx.fillRect(-p.s*S/2,-p.s*S/4,p.s*S,p.s*S/2); ctx.restore(); }
    else ctx.fillRect(q.x-p.s*S/2,q.y-p.s*S/2,p.s*S,p.s*S);
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const p of popups){
    const q=P(p.x,p.y);
    ctx.font=`800 ${p.size*S}px 'JetBrains Mono', monospace`;
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life));
    ctx.shadowColor='rgba(0,0,0,.5)'; ctx.shadowBlur=8;
    ctx.fillStyle=p.color; ctx.fillText(p.text,q.x,q.y);
    ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;

  if(wind!==0 && state!=='over'){
    const n=Math.ceil(Math.abs(wind)/50);
    ctx.font=`800 ${14*S}px 'JetBrains Mono', monospace`;
    ctx.fillStyle='rgba(180,220,255,.75)';
    ctx.fillText(`WIND ${wind>0?'▶'.repeat(n):'◀'.repeat(n)} ${Math.abs(Math.round(wind))}`, W/2, 118);
  }
}
function drawPlat(pl){
  const dip=Math.sin(Math.min(1,pl.bounce)*Math.PI)*7;
  const tl=P(pl.x-pl.w/2, pl.y-dip), s=S*(1+zoom*0.06);
  const w=pl.w*s, h=26*s;
  const g=ctx.createLinearGradient(0,tl.y,0,tl.y+H);
  g.addColorStop(0,'rgba(255,255,255,.13)'); g.addColorStop(1,'rgba(255,255,255,.02)');
  ctx.fillStyle=g; ctx.fillRect(tl.x+w*0.22,tl.y+4,w*0.56,H);
  ctx.fillStyle='rgba(255,255,255,.14)';
  roundRect(tl.x,tl.y,w,h,8*s); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1.5;
  roundRect(tl.x,tl.y,w,h,8*s); ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(tl.x+6*s,tl.y+2); ctx.lineTo(tl.x+w-6*s,tl.y+2); ctx.stroke();
}
function drawBottle(){
  if(state==='dying'&&!diePlat&&bottle.y<Math.min(cur.y,next.y)-700) return;
  const skin=SKINS[Math.floor(flips/10)%SKINS.length];
  const squash=charging?1-power*0.0016:1;
  const stretch=charging?1+power*0.0013:1;
  const wob=wobbleT>0?Math.sin(wobbleT*22)*0.16*wobbleT:0;
  const c=P(bottle.x, bottle.y+BH/2);   // bottle.y = bottom → center is +BH/2
  const s=S*(1+zoom*0.06);
  if(streak>=5){
    const gl=ctx.createRadialGradient(c.x,c.y,4,c.x,c.y,70*s);
    gl.addColorStop(0,'rgba(255,157,60,.35)'); gl.addColorStop(1,'rgba(255,157,60,0)');
    ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(c.x,c.y,70*s,0,7); ctx.fill();
  }
  ctx.save();
  ctx.translate(c.x, c.y+(1-squash)*BH/2*s);
  ctx.rotate(-(bottle.ang+wob));
  ctx.scale(stretch*s, squash*s);
  ctx.save();
  roundRect(-15,-18,30,62,7); ctx.clip();
  const slosh=Math.max(-0.5,Math.min(0.5,-bottle.om*0.045))+Math.sin(time*5)*0.04;
  ctx.translate(0,8); ctx.rotate(slosh);
  ctx.fillStyle=skin.water; ctx.fillRect(-40,0,80,70);
  ctx.fillStyle='rgba(255,255,255,.35)'; ctx.fillRect(-40,0,80,3);
  ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=2.5;
  ctx.fillStyle='rgba(255,255,255,.07)';
  roundRect(-17,-20,34,66,9); ctx.fill(); ctx.stroke();
  roundRect(-7,-38,14,20,4); ctx.fill(); ctx.stroke();
  ctx.fillStyle=skin.cap;
  roundRect(-8,-47,16,10,3); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(-10,-12); ctx.lineTo(-10,30); ctx.stroke();
  ctx.restore();
}

// ------- loop -------
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,0.05); last=now;
  update(dt); render();
}

// ------- input -------
function press(){
  ensureAudio();
  if(state==='ready'){ charging=true; chDir=1; power=0; }
  else if(state==='over' && performance.now()-overAt>500) reset();
}
addEventListener('pointerdown', e=>{ e.preventDefault(); press(); });
addEventListener('pointerup', ()=>{ if(state==='ready') release(); });
addEventListener('keydown', e=>{ if(e.code==='Space'){ e.preventDefault(); if(!e.repeat) press(); } });
addEventListener('keyup', e=>{ if(e.code==='Space' && state==='ready') release(); });

reset();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
